version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  except:
    # Inherited v1 contract shape (moved verbatim from sqlrest/varyd in the
    # 002-repo-split): the fleet layout maps each .proto to its own generated
    # package via per-file go_package (api/proto/<name>.proto ->
    # src/proto/<name>), and the flat single proto package `varyd.api.v1`
    # predates buf's directory/package conventions. Restructuring into
    # per-domain packages (varyd.api.document.v1, ...) and prefixed enum
    # values is a breaking contract redesign, deferred to a future v2 proto
    # package. Changes within v1 stay additive-only.
    - PACKAGE_VERSION_SUFFIX
    - FIELD_NOT_REQUIRED
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_GO_PACKAGE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - FILE
