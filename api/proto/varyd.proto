syntax = "proto3";

package varyd.api.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "types.proto";

option go_package = "github.com/sqlrest/go-varyd/src/proto/varyd";

// Common data structures for unified results
message Data {
  string id = 1;
  string model = 2;
  repeated TypedValue values = 3;
  map<string, string> properties = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Link {
  string id = 1;
  string source_id = 2;
  string target_id = 3;
  string type = 4;
  map<string, string> properties = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Result {
  bool success = 1;
  string message = 2;
  repeated Data data = 3;
  repeated Link links = 4;
  map<string, google.protobuf.Any> metadata = 5;
  Error error = 6;
}

// Common request/response wrappers
message Request {
  string session_id = 1;
  string user_id = 2;
  map<string, string> context = 3;
  RequestContext request_context = 4;
}

message Response {
  Result result = 1;
  map<string, google.protobuf.Any> metadata = 2;
}

// Authentication and authorization
message AuthContext {
  string user_id = 1;
  repeated string roles = 2;
  repeated string permissions = 3;
  map<string, string> claims = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message RequestContext {
  string request_id = 1;
  AuthContext auth = 2;
  map<string, string> metadata = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// Session management
message Session {
  string session_id = 1;
  string user_id = 2;
  AuthContext auth_context = 3;
  map<string, string> properties = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_accessed = 6;
  google.protobuf.Timestamp expires_at = 7;
}

// Query execution context
message QueryContext {
  string query_id = 1;
  string session_id = 2;
  string sql_dialect = 3;
  repeated string target_services = 4;
  map<string, string> options = 5;
  google.protobuf.Timestamp started_at = 6;
}

// Cross-service operation results
message CrossServiceResult {
  string operation_id = 1;
  repeated ServiceResult service_results = 2;
  bool success = 3;
  Error error = 4;
  google.protobuf.Timestamp completed_at = 5;
}

message ServiceResult {
  string service_name = 1;
  string operation = 2;
  bool success = 3;
  google.protobuf.Any result = 4;
  Error error = 5;
  double execution_time_ms = 6;
}

// Health check and service discovery
message HealthCheck {
  string service_name = 1;
  HealthStatus status = 2;
  string version = 3;
  google.protobuf.Timestamp timestamp = 4;
  map<string, string> metadata = 5;
}

enum HealthStatus {
  UNKNOWN = 0;
  HEALTHY = 1;
  DEGRADED = 2;
  UNHEALTHY = 3;
  MAINTENANCE = 4;
}

// Metrics and observability
message Metrics {
  string service_name = 1;
  string operation = 2;
  int64 request_count = 3;
  double average_response_time_ms = 4;
  int64 error_count = 5;
  double success_rate = 6;
  google.protobuf.Timestamp window_start = 7;
  google.protobuf.Timestamp window_end = 8;
}

message TraceSpan {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  string service_name = 4;
  string operation = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  int64 duration_ms = 8;
  map<string, string> tags = 9;
  repeated LogEntry logs = 10;
}

message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  LogLevel level = 2;
  string message = 3;
  map<string, string> fields = 4;
}

enum LogLevel {
  TRACE = 0;
  DEBUG = 1;
  INFO = 2;
  WARN = 3;
  ERROR = 4;
  FATAL = 5;
}