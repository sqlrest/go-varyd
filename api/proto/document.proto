// DocumentService proto contract for VaryD PoC
// This file defines the gRPC service for document/collection operations (DocSQL dialect).
// To be placed at api/proto/document.proto during implementation.

syntax = "proto3";

package varyd.api.v1;

import "google/protobuf/timestamp.proto";
import "types.proto";

option go_package = "github.com/sqlrest/go-varyd/src/proto/document";

service DocumentService {
  // Collection operations
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc DescribeCollection(DescribeCollectionRequest) returns (DescribeCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);

  // Document operations
  rpc InsertDocument(InsertDocumentRequest) returns (InsertDocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc UpdateDocument(UpdateDocumentRequest) returns (UpdateDocumentResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Search operations
  rpc Search(SearchRequest) returns (SearchResponse);
}

// Collection operations

message CreateCollectionRequest {
  string name = 1;
  bool if_not_exists = 2;
  map<string, string> options = 3;
}

message CreateCollectionResponse {
  bool success = 1;
  string message = 2;
  Error error = 3;
}

message DropCollectionRequest {
  string name = 1;
  bool if_exists = 2;
  map<string, string> options = 3;
}

message DropCollectionResponse {
  bool success = 1;
  string message = 2;
  Error error = 3;
}

message DescribeCollectionRequest {
  string name = 1;
  map<string, string> options = 2;
}

message DescribeCollectionResponse {
  bool success = 1;
  string name = 2;
  int64 document_count = 3;
  int64 index_term_count = 4;
  Error error = 5;
}

message ListCollectionsRequest {
  map<string, string> options = 1;
}

message ListCollectionsResponse {
  bool success = 1;
  repeated string names = 2;
  Error error = 3;
}

// Document operations

message InsertDocumentRequest {
  string collection = 1;
  string document_id = 2;
  string content_json = 3;
  map<string, string> options = 4;
}

message InsertDocumentResponse {
  bool success = 1;
  string document_id = 2;
  Error error = 3;
}

message GetDocumentRequest {
  string collection = 1;
  string document_id = 2;
  map<string, string> options = 3;
}

message GetDocumentResponse {
  bool success = 1;
  string document_id = 2;
  string content_json = 3;
  google.protobuf.Timestamp created_at = 4;
  Error error = 5;
}

message UpdateDocumentRequest {
  string collection = 1;
  string document_id = 2;
  string content_json = 3;
  map<string, string> options = 4;
}

message UpdateDocumentResponse {
  bool success = 1;
  string document_id = 2;
  Error error = 3;
}

message DeleteDocumentRequest {
  string collection = 1;
  string document_id = 2;
  map<string, string> options = 3;
}

message DeleteDocumentResponse {
  bool success = 1;
  Error error = 2;
}

// Search operations

message SearchRequest {
  string collection = 1;
  string query = 2;
  repeated string fields = 3;
  map<string, float> boost = 4;
  float min_score = 5;
  int32 limit = 6;
  int32 offset = 7;
  map<string, string> options = 8;
}

message SearchResponse {
  bool success = 1;
  repeated SearchResult results = 2;
  int64 total_matches = 3;
  Error error = 4;
}

message SearchResult {
  string document_id = 1;
  string content_json = 2;
  float score = 3;
  map<string, string> highlights = 4;
}
